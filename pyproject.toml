[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unknown-file-threat-agent"
version = "0.1.0"
description = "Evidence-grounded Linux unknown-file threat investigation agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10",
  "deepagents>=0.7,<0.8",
  "langchain>=1.3,<1.4",
  "langchain-openai>=1.1,<1.2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
threat-agent = "threat_agent.cli:main"

[tool.setuptools.packages.find]
include = ["threat_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unknown-file-threat-agent"
version = "0.1.0"
description = "Evidence-grounded Linux unknown-file threat investigation agent"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<3.2",
  "langchain>=1.3,<1.4",
  "langchain-openai>=1.1,<1.2",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
threat-agent-demo = "threat_agent.bootstrap.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["threat_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

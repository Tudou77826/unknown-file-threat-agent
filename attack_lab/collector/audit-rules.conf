## SecLab 自建采集 — auditd 规则（对齐态势感知探针十类中的可审计部分）
## 键 secval 用于靶场窗口过滤；规则最小化，避免靶机日志噪音。
## 部署: cp audit-rules.conf /etc/audit/rules.d/secval.rules && augenrules --load

## §1 进程：执行与命令行（EXECVE 携带参数）——低频，保持全捕
-a always,exit -F arch=b64 -S execve -k secval
## §2 文件：限定目录树监听。
##    曾用全捕 openat（success + EACCES/EPERM 两类）：繁忙靶机上 ~1300 事件/秒
##    饱和 auditd 积压（backlog_limit 8192），内核随机丢事件——第二批采集实证：
##    窗口内 python3 的 execve/connect 全部丢失而轮询器看到 42 条 ESTAB。
##    watch 同样产出 SYSCALL+PATH（nametype 分类不变），投影链路兼容；
##    EACCES/EPERM 的拒绝写入在 watch 上同样落记录（success=no）。
-w /opt/secval-lab/ -p wa -k secval
-w /usr/local/sbin/ -p wa -k secval
-w /usr/local/bin/ -p wa -k secval
-w /root/.ssh/ -p wa -k secval
-w /etc/passwd -p wa -k secval
-w /etc/shadow -p wa -k secval
-w /var/log/secval-demo/ -p wa -k secval
## 2026-10-10 复核整改：轮转案的归档目的地此前不在监听内，"移入备份目录"
## 只有命令没有文件记录——良性依据链缺最后一环。
-w /var/backups/secval-demo/ -p wa -k secval
## §3 网络：出站 connect（sockaddr 含四元组）——低频，保持全捕
-a always,exit -F arch=b64 -S connect -F success=1 -k secval
## §4 系统调用：提权与挂载
-a always,exit -F arch=b64 -S setuid,setgid,mount -k secval
## §5/§7 登录与命令执行（auditd 内建类型 USER_CMD / USER_LOGIN）
-w /etc/cron.d/ -p wa -k secval
-w /etc/systemd/system/ -p wa -k secval
-w /etc/rc.d/ -p wa -k secval
## §10 端口：监听端口由 collect.sh 的 ss 快照承担（auditd 不覆盖 bind 亲和信息）
